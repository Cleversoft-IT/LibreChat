services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: api-build
    # image: ghcr.io/danny-avila/librechat-dev-api:latest
    container_name: LibreChat-API
    ports:
      - 3080:3080
    depends_on:
      - mongodb
      - rag_api
    restart: always
    extra_hosts:
    - "host.docker.internal:host-gateway"
    networks:
      default: {}
      codeapi-net: {}
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://admin.localhost}
      # Code Interpreter (self-hosted ClickHouse code-interpreter). Reached over
      # the shared external `codeapi-net` network at alias `codeapi`; auth is a
      # JWT signed with the EdDSA private key below. See deploy/codeapi/README.md.
      - LIBRECHAT_CODE_BASEURL=${LIBRECHAT_CODE_BASEURL:-http://codeapi:3112/v1}
      - CODEAPI_AUTH_PROVIDER=${CODEAPI_AUTH_PROVIDER:-librechat-jwt}
      - CODEAPI_JWT_ALGORITHM=${CODEAPI_JWT_ALGORITHM:-EdDSA}
      - CODEAPI_JWT_ISSUER=${CODEAPI_JWT_ISSUER:-librechat}
      - CODEAPI_JWT_AUDIENCE=${CODEAPI_JWT_AUDIENCE:-codeapi}
      - CODEAPI_JWT_KID=${CODEAPI_JWT_KID:-lc-codeapi-1}
      - CODEAPI_JWT_PRIVATE_KEY_BASE64=${CODEAPI_JWT_PRIVATE_KEY_BASE64:-}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      # - ./icons/icon-192x192.png:/app/client/dist/assets/icon-192x192.png
      # - ./icons/favicon.ico:/app/client/dist/assets/favicon.ico
      # - ./icons/favicon.ico:/app/client/public/assets/favicon.ico
      # - ./icons/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png
      # - ./icons/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png
      # - ./icons/favicon-16x16.png:/app/client/public/assets/favicon-16x16.png
      # - ./icons/favicon-32x32.png:/app/client/public/assets/favicon-32x32.png
      # - ./icons/apple-touch-icon.png:/app/client/dist/assets/apple-touch-icon.png
      # - ./icons/apple-touch-icon.png:/app/client/public/assets/apple-touch-icon.png
      # - ./icons/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png
      # - ./icons/apple-touch-icon-180x180.png:/app/client/public/assets/apple-touch-icon-180x180.png
      # - ./icons/android-chrome-192x192.png:/app/client/dist/assets/android-chrome-192x192.png
      # - ./icons/android-chrome-192x192.png:/app/client/public/assets/android-chrome-192x192.png
      # - ./icons/android-chrome-512x512.png:/app/client/dist/assets/android-chrome-512x512.png
      # - ./icons/android-chrome-512x512.png:/app/client/public/assets/android-chrome-512x512.png
      # - ./icons/web-app-manifest-192x192.png:/app/client/dist/assets/web-app-manifest-192x192.png
      # - ./icons/web-app-manifest-192x192.png:/app/client/public/assets/web-app-manifest-192x192.png
      # - ./icons/web-app-manifest-512x512.png:/app/client/dist/assets/web-app-manifest-512x512.png
      # - ./icons/web-app-manifest-512x512.png:/app/client/public/assets/web-app-manifest-512x512.png
      - ./skill:/app/skill

  # Admin Panel (v0.8.7) — not adopted yet. To enable: uncomment this service,
  # re-add `- admin-panel` to the client depends_on below, and set
  # ADMIN_PANEL_SESSION_SECRET in .env.
  # admin-panel:
  #   image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
  #   container_name: admin-panel
  #   depends_on:
  #     - api
  #   restart: always
  #   environment:
  #     - PORT=3000
  #     # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
  #     # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
  #     - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
  #     - API_SERVER_URL=http://api:3080
  #     - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost}
  #     - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  client:
    image: nginx:1.27.0-alpine
    container_name: LibreChat-NGINX
    ports:
      - 80:80
      - 443:443
    depends_on:
      - api
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/live:/etc/letsencrypt/live
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf
      - /etc/letsencrypt/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem
  mongodb:
    container_name: chat-mongodb
    # ports:  # Uncomment this to access mongodb from outside docker, not safe in deployment
    #   - 27018:27017
    image: mongo:8.0.20
    restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  pgdata2:

networks:
  # Shared bridge to the self-hosted code-interpreter stack (alias: codeapi).
  # Create once with: docker network create codeapi-net
  codeapi-net:
    external: true
